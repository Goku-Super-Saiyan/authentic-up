<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" role="img" aria-label="Incredible UP">
  <svg x="10" y="10" width="100" height="120" viewBox="0 0 240 290">
  <defs>
    <linearGradient id="h-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7A6"/><stop offset=".35" stop-color="#E7BE63"/><stop offset=".65" stop-color="#B8862B"/><stop offset="1" stop-color="#F6D98C"/>
    </linearGradient>
    <linearGradient id="h-saffron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/><stop offset=".45" stop-color="#FFB627"/><stop offset="1" stop-color="#F0445A"/>
    </linearGradient>
    <linearGradient id="h-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120A2C"/><stop offset=".5" stop-color="#341452"/><stop offset=".8" stop-color="#7A2A5E"/><stop offset="1" stop-color="#B33A58"/>
    </linearGradient>
    <radialGradient id="h-moonGlow"><stop offset="0" stop-color="#FFF4E2" stop-opacity=".5"/><stop offset="1" stop-color="#FFF4E2" stop-opacity="0"/></radialGradient>
    <radialGradient id="h-halo"><stop offset="0" stop-color="#FFB627" stop-opacity=".7"/><stop offset="1" stop-color="#FF8A1F" stop-opacity="0"/></radialGradient>
  </defs>
  
  <path d="M14 284V128C14 80 66 44 120 6C174 44 226 80 226 128V284" fill="none" stroke="url(#h-gold)" stroke-width="2" opacity=".75"/>
  <path d="M24 284V132.0A12.3 12.3 0 0 1 27.1 112.4A13.0 13.0 0 0 1 35.5 93.1A13.9 13.9 0 0 1 48.2 74.7A14.5 14.5 0 0 1 64.1 57.6A14.7 14.7 0 0 1 82.1 42.2A14.4 14.4 0 0 1 101.1 28.8A13.5 13.5 0 0 1 120.0 18.0A13.5 13.5 0 0 1 138.9 28.8A14.4 14.4 0 0 1 157.9 42.2A14.7 14.7 0 0 1 175.9 57.6A14.5 14.5 0 0 1 191.8 74.7A13.9 13.9 0 0 1 204.5 93.1A13.0 13.0 0 0 1 212.9 112.4A12.3 12.3 0 0 1 216.0 132.0V284Z" fill="url(#h-sky)" stroke="url(#h-gold)" stroke-width="5" stroke-linejoin="round"/>
  <g fill="#FFF4E2">
    <path d="M196 140l1.8 4.5 4.5 1.8-4.5 1.8-1.8 4.5-1.8-4.5-4.5-1.8 4.5-1.8z" opacity=".85"/>
    <circle cx="44" cy="124" r="1.6" opacity=".7"/><circle cx="64" cy="98" r="1.2" opacity=".6"/><circle cx="206" cy="176" r="1.3" opacity=".6"/>
    <circle class="h-blink" cx="98" cy="62" r="1.3" opacity=".7"/>
  </g>

  <g transform="translate(120 170) scale(.84) translate(-125 -160)">
  <!-- U: a clay diya floating on the Ganga, its flame a Banarasi buta -->
  <g class="h-float">
    <circle class="h-glow" cx="82" cy="150" r="34" fill="url(#h-halo)"/>
    <path class="h-flame" d="M82 116C96 128 98 150 86 162C76 170 64 162 68 150C71 141 80 141 80 133C80 127 82 121 82 116Z" fill="url(#h-saffron)"/>
    <path d="M78 156c-3-5 0-10 4-10" fill="none" stroke="#FFF1C9" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
    <path d="M44 128C38 124 36 120 38 116M120 128C126 124 128 120 126 116" fill="none" stroke="url(#h-gold)" stroke-width="6" stroke-linecap="round"/>
    <path d="M44 120V178A38 38 0 0 0 120 178V120" fill="none" stroke="url(#h-gold)" stroke-width="17" stroke-linecap="round"/>
    
    <path d="M52 196q30 18 60 0" fill="none" stroke="#8A5A17" stroke-width="2" opacity=".6"/>
  </g>

  <!-- P: a Sarus crane. Neck is the stem; head and beak close the bowl. -->
  <path d="M156 244V100C156 72 176 60 194 66C212 72 214 100 196 110L176 118" fill="none" stroke="url(#h-gold)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  
  <path d="M184 110L140 140L178 124Z" fill="url(#h-gold)" stroke="url(#h-gold)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M176 66C182 58 196 56 202 64C196 66 186 68 176 66Z" fill="#F0445A"/>
  <!-- small crescent moon inside the P's bowl -->
  <circle class="h-moon" cx="183" cy="90" r="13" fill="url(#h-moonGlow)"/>
  <path d="M181 81a9 9 0 1 0 6.5 15.5a7 7 0 1 1 -6.5 -15.5z" fill="#FFF4E2"/>
  <circle cx="197" cy="72" r="3" fill="#140A2E"/>
  </g>
  <path class="h-wave" d="M40 236q10-6 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0" fill="none" stroke="#7FD3DE" stroke-width="2.4" stroke-dasharray="14 6" stroke-linecap="round" opacity=".85"/>
  <path d="M56 246q8-4 16 0t16 0t16 0t16 0t16 0t16 0t16 0t16 0" fill="none" stroke="#7FD3DE" stroke-width="1.4" opacity=".5"/>
  <g fill="url(#h-gold)" opacity="0.9">
    <rect x="28" y="262" width="184" height="3"/><rect x="20" y="272" width="200" height="3"/>
  </g>
</svg>
  <text x="128" y="78" font-family="Rozha One, Georgia, serif" font-size="56" fill="#FFF4E2">Incredible <tspan fill="#E7BE63">UP</tspan></text>
  <text x="130" y="112" font-family="Mukta, sans-serif" font-size="20" fill="#B7A8CF">अतुल्य उत्तर प्रदेश</text>
</svg>