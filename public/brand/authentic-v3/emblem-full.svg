<svg viewBox="0 0 240 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Authentic UP emblem, यूपी की प्रामाणिक पहचान">
  <defs>
    <linearGradient id="aufull-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7A6"/><stop offset=".35" stop-color="#E7BE63"/><stop offset=".65" stop-color="#B8862B"/><stop offset="1" stop-color="#F6D98C"/>
    </linearGradient>
    <linearGradient id="aufull-silk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/><stop offset=".45" stop-color="#FFB627"/><stop offset="1" stop-color="#F0445A"/>
    </linearGradient>
    <linearGradient id="aufull-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F0828"/><stop offset=".35" stop-color="#2E1257"/><stop offset=".6" stop-color="#7A2763"/><stop offset=".8" stop-color="#E0565B"/><stop offset="1" stop-color="#FFB25E"/>
    </linearGradient>
    <linearGradient id="aufull-river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2415A"/><stop offset=".35" stop-color="#5E1D52"/><stop offset="1" stop-color="#1A0B30"/>
    </linearGradient>
    <radialGradient id="aufull-sunGlow"><stop offset="0" stop-color="#FFD27A" stop-opacity=".9"/><stop offset=".45" stop-color="#FF8A3D" stop-opacity=".45"/><stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/></radialGradient>
    <linearGradient id="aufull-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4FD1C5"/><stop offset="1" stop-color="#1F6FB2"/></linearGradient>
    <radialGradient id="aufull-flameGlow"><stop offset="0" stop-color="#FFB627" stop-opacity=".7"/><stop offset="1" stop-color="#FF8A1F" stop-opacity="0"/></radialGradient>
    <clipPath id="aufull-clip"><path d="M24 284V132.0A12.3 12.3 0 0 1 27.1 112.4A13.0 13.0 0 0 1 35.5 93.1A13.9 13.9 0 0 1 48.2 74.7A14.5 14.5 0 0 1 64.1 57.6A14.7 14.7 0 0 1 82.1 42.2A14.4 14.4 0 0 1 101.1 28.8A13.5 13.5 0 0 1 120.0 18.0A13.5 13.5 0 0 1 138.9 28.8A14.4 14.4 0 0 1 157.9 42.2A14.7 14.7 0 0 1 175.9 57.6A14.5 14.5 0 0 1 191.8 74.7A13.9 13.9 0 0 1 204.5 93.1A13.0 13.0 0 0 1 212.9 112.4A12.3 12.3 0 0 1 216.0 132.0V284Z"/></clipPath>
  </defs>
  <style>
        .aufull-run{animation:aufull-run 3s linear infinite}
        @keyframes aufull-run{to{stroke-dashoffset:-240}}
        .aufull-shim{animation:aufull-shim 2.6s ease-in-out infinite}
        @keyframes aufull-shim{50%{opacity:.25;transform:translateX(3px)}}
        .aufull-shim2{animation:aufull-shim 2.6s ease-in-out -1.3s infinite}
        .aufull-bob{animation:aufull-bob 3s ease-in-out infinite}
        @keyframes aufull-bob{50%{transform:translateY(1.6px)}}
        .aufull-sun{animation:aufull-sun 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
        @keyframes aufull-sun{50%{transform:scale(1.08);opacity:.8}}
        .aufull-fly{animation:aufull-fly 9s ease-in-out infinite}
        @keyframes aufull-fly{50%{transform:translate(8px,-4px)}}
        .aufull-flame{animation:aufull-flame 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
        @keyframes aufull-flame{50%{transform:scale(.9,1.08) rotate(-3deg)}}
        .aufull-halo{animation:aufull-halo 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
        @keyframes aufull-halo{50%{opacity:.35;transform:scale(1.15)}}
        @media (prefers-reduced-motion: reduce){.aufull-run,.aufull-shim,.aufull-shim2,.aufull-bob,.aufull-sun,.aufull-fly,.aufull-flame,.aufull-halo{animation:none}}
      </style>
