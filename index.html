<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Incredible UP</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <style>
      /* The readable copy inside #root before the app starts; it only shows if the app is slow or can't run. */
      .seo-copy { max-width: 760px; margin: 0 auto; padding: 96px 20px; color: #FFF4E2; font-family: Mukta, system-ui, sans-serif; line-height: 1.6; animation: seo-in .4s 2s both; }
      .seo-copy h1, .seo-copy h2, .seo-copy h3 { font-family: "Rozha One", Georgia, serif; font-weight: 400; color: #E7BE63; }
      .seo-copy a { color: #FFB627; }
      @keyframes seo-in { from { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
